services:
  app:
    image: worthpath:${WORTHPATH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3100:3100'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
