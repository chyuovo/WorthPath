services:
  app:
    image: worthpath:${WORTHPATH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      ICON_STORAGE_DIR: /app/data/icons
    volumes:
      - type: bind
        source: /opt/worthpath/data/icons
        target: /app/data/icons
        bind:
          create_host_path: false
    ports:
      - '127.0.0.1:3100:3100'
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
